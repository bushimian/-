# /etc/nginx/nginx.conf 或 docker中的 nginx.conf
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# 性能优化
events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式（包含请求时间、IP、响应时间等）
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # 基础优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    types_hash_max_size 2048;
    client_max_body_size 20M;  # 允许上传最大20MB
    client_body_buffer_size 128k;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/ttf
        font/woff
        font/woff2;
    gzip_disable "msie6";

    # 限流配置（防止DDoS）
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # 上游服务器（真实后端API）
    upstream backend_api {
        # 负载均衡策略：least_conn（最少连接）
        least_conn;
        
        # 后端服务器列表
        server 127.0.0.1:3000 weight=3 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:3001 weight=2 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:3002 backup;  # 备用服务器
        
        # 保持连接
        keepalive 32;
        keepalive_timeout 60s;
    }

    # WebSocket支持（用于AI流式对话）
    upstream websocket_backend {
        ip_hash;  # 保持同一客户端连接同一后端
        server 127.0.0.1:4000;
        server 127.0.0.1:4001;
    }

    # ========================================
    # HTTP 服务器（重定向到 HTTPS）
    # ========================================
    server {
        listen 80;
        listen [::]:80;
        server_name campus.ecut.edu.cn www.ecut.edu.cn;
        
        # Let's Encrypt SSL证书验证
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        # 强制跳转HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # ========================================
    # HTTPS 主服务器
    # ========================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name campus.ecut.edu.cn;

        # SSL证书配置
        ssl_certificate /etc/nginx/ssl/ecut.edu.cn.pem;
        ssl_certificate_key /etc/nginx/ssl/ecut.edu.cn.key;
        
        # SSL安全强化
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        
        # HSTS (强制HTTPS)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # 安全响应头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        
        # CSP (内容安全策略)
        add_header Content-Security-Policy "default-src 'self'; 
            script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; 
            style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; 
            font-src 'self' https://fonts.gstatic.com; 
            img-src 'self' data: https:; 
            connect-src 'self' https://api.ecut.edu.cn wss://api.ecut.edu.cn; 
            frame-src 'none';" always;

        # 根目录（前端构建产物）
        root /usr/share/nginx/html;
        index index.html;

        # ========================================
        # 前端路由（Vue Router History模式）
        # ========================================
        location / {
            # 限流
            limit_conn conn_limit 20;
            
            try_files $uri $uri/ /index.html;
            
            # 缓存策略
            location ~* \.(html)$ {
                add_header Cache-Control "no-cache, must-revalidate";
                expires 0;
            }
        }

        # ========================================
        # 静态资源缓存
        # ========================================
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
            access_log off;
            
            # 对于带hash的构建文件，可以更激进缓存
            location ~* \.[a-f0-9]{8,}\.(js|css)$ {
                expires 2y;
                add_header Cache-Control "public, immutable";
            }
        }

        # ========================================
        # API 代理
        # ========================================
        location /api/ {
            # 限流保护
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 20;
            
            # 代理设置
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            
            # 请求头转发
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # 连接优化
            proxy_set_header Connection "";
            proxy_buffering off;  # 关闭缓冲（对SSE重要）
            
            # 超时设置
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
            
            # 请求体重写（移除/api前缀转发给后端）
            rewrite ^/api/(.*) /$1 break;
            
            # 错误处理
            proxy_intercept_errors on;
            error_page 502 503 504 /50x.html;
        }

        # ========================================
        # 登录接口特殊限制（防暴力破解）
        # ========================================
        location /api/auth/login/ {
            limit_req zone=login_limit burst=5 nodelay;
            limit_conn conn_limit 5;
            
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            
            rewrite ^/api/(.*) /$1 break;
            
            # 记录详细日志
            access_log /var/log/nginx/login.log main;
        }

        # ========================================
        # WebSocket 代理（AI流式对话）
        # ========================================
        location /ws/ {
            proxy_pass http://websocket_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # WebSocket超时
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ========================================
        # SSE (Server-Sent Events) 用于AI流式响应
        # ========================================
        location /api/ai/chat/stream {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection "";
            
            # SSE关键配置
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Cache-Control "no-cache";
            chunked_transfer_encoding on;
            
            # 长连接超时
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            
            rewrite ^/api/(.*) /$1 break;
        }

        # ========================================
        # 健康检查端点（无需认证）
        # ========================================
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ========================================
        # 错误页面
        # ========================================
        error_page 404 /404.html;
        location = /404.html {
            internal;
            root /usr/share/nginx/html;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
            root /usr/share/nginx/html;
        }

        # 禁止访问隐藏文件
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # 禁止访问备份文件
        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # ========================================
    # 管理后台（独立子域名，内网IP限制）
    # ========================================
    server {
        listen 443 ssl http2;
        server_name admin.ecut.edu.cn;

        ssl_certificate /etc/nginx/ssl/admin.ecut.edu.cn.pem;
        ssl_certificate_key /etc/nginx/ssl/admin.ecut.edu.cn.key;
        
        # IP白名单（仅允许校内IP）
        allow 202.101.224.0/20;  # 校园网段
        allow 10.0.0.0/8;        # 内网
        allow 172.16.0.0/12;     # 内网
        deny all;
        
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}